name: release

# Publishes to PyPI when a GitHub release is published. Uses PyPI Trusted Publishing (OpenID Connect), so no API
# token is stored in this repository.
#
# One-time setup on PyPI: Account > Publishing > add a pending publisher for project "mesh-cli", owner
# "mrahmedromman", repository "mesh-cli", workflow "release.yml", environment "pypi". Do the same on test.pypi.org
# with environment "testpypi" to use the dry run below. Create both environments under Settings > Environments.
#
# Dry run: Actions > release > Run workflow builds the package and uploads it to TestPyPI only.
# Release: create a GitHub release whose tag is v<version> (for example v0.1.0).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: The release tag must match the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/mesh_cli/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in src/mesh_cli/__init__.py"
            exit 1
          fi
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # lets PyPI verify this workflow's identity
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

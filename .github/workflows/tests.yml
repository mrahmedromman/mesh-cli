name: tests

# Run on every push to any branch, and allow starting it by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

# The token these jobs get can only read the repository.
permissions:
  contents: read

jobs:
  # Installs the package and runs the test suite once per Python version, on a fresh Linux machine each time.
  test:
    runs-on: ubuntu-24.04       # pinned so a change to the "latest" image does not break the build unexpectedly
    strategy:
      fail-fast: false          # keep going if one version fails, so we see all the results
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package with test tools
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # Style and type checks, once, on the newest Python.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the package with dev tools
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy

  # The oldest versions of the dependencies we claim to support, on the oldest Python.
  minimum-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install the declared minimum versions
        run: |
          pip install "pydantic==2.5.0" "pyyaml==6.0.1" "rich==13.0.0" pytest
          pip install -e . --no-deps
      - name: Run tests
        run: pytest -q

  # Builds the package the way a release would, checks it, installs it and runs the command.
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]   # the oldest and newest supported versions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and check
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Install the built wheel and run it
        run: |
          pip install dist/*.whl
          mesh --version
          python -m mesh_cli --version

<svg xmlns="http://www.w3.org/2000/svg" width="340" height="96" viewBox="0 0 340 96" role="img" aria-label="mesh-deck">
  <title>mesh-deck</title>
  <!-- Two GPUs as tall outlines. Coloured blocks are services sharing the memory; the empty top is free memory. -->
  <rect x="8" y="8" width="32" height="80" rx="6" fill="none" stroke="#374151" stroke-width="3"/>
  <rect x="12" y="50" width="24" height="34" rx="3" fill="#3b82f6"/>
  <rect x="12" y="28" width="24" height="20" rx="3" fill="#14b8a6"/>

  <rect x="48" y="8" width="32" height="80" rx="6" fill="none" stroke="#374151" stroke-width="3"/>
  <rect x="52" y="50" width="24" height="34" rx="3" fill="#3b82f6"/>
  <rect x="52" y="36" width="24" height="12" rx="3" fill="#f59e0b"/>
  <rect x="52" y="22" width="24" height="12" rx="3" fill="#8b5cf6"/>

  <text x="100" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="40" font-weight="700" fill="#111827">mesh-deck</text>
</svg>
